<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KANJI WORLD 草原のはじまり</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4dc;color:#62442d;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif}header{text-align:center;padding:12px;font-size:21px;font-weight:900;background:#fff1cd}.wrap{max-width:960px;margin:auto;padding:10px}#game{width:100%;aspect-ratio:4/3;max-height:66vh;display:block;border:5px solid #b48a55;border-radius:18px;background:#a7d58a;touch-action:none;box-shadow:0 5px 18px #684d2c33}.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.pill{background:white;border:2px solid #d9b77d;border-radius:14px;padding:7px 12px;font-weight:bold}button{cursor:pointer;border:2px solid #b98c57;background:#ffe3a6;color:#60452e;border-radius:14px;padding:10px 14px;font-size:16px;font-weight:800}.directions{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);justify-content:center;gap:4px;margin:10px}.directions button{padding:5px;touch-action:none}.directions .up{grid-column:2}.directions .left{grid-column:1;grid-row:2}.directions .down{grid-column:2;grid-row:2}.directions .right{grid-column:3;grid-row:2}.note{text-align:center;font-size:14px;line-height:1.7}.overlay{position:fixed;inset:0;background:#43311dcc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.overlay[hidden]{display:none}.panel{background:#fff8e8;border:5px solid #c7a26d;border-radius:24px;padding:17px;width:min(570px,100%);max-height:95vh;overflow:auto;text-align:center}.panel h2{margin:5px 0}.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero{background:#fff;border:3px solid #dec7a2;border-radius:15px;padding:8px 2px;font-size:12px;min-width:0}.hero[aria-pressed=true]{border-color:#f07caa;background:#ffebf3}.preview{height:94px;display:flex;align-items:center;justify-content:center}.preview svg{height:90px;width:80px}.hero strong{display:block}.panel input{font-size:18px;border:2px solid #c4a16e;border-radius:12px;padding:11px;width:90%;margin:12px auto}.start{background:#f8a1ba;border-color:#db7193;padding:13px 22px}.msg{min-height:20px;color:#aa3758}@media(max-width:430px){header{font-size:18px}.preview{height:76px}.preview svg{height:73px}.hero{font-size:11px}.panel{padding:10px}}</style></head><body><header>🌸 KANJI WORLD — はじまりの草原 🌱</header><main class="wrap"><div class="hud"><span class="pill" id="heroLabel">🌱 はじまりの草原</span><button id="change">👤 キャラをかえる</button></div><canvas id="game" width="800" height="600" aria-label="広い草原。行きたい場所をタップすると主人公が歩きます"></canvas><div class="directions"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><p class="note">🌷 草原をタップすると、そこまで歩くよ！<br>矢印を押し続けても歩けるよ。<br>🏡 家やお店は、これから一緒につくろう！</p></main><div class="overlay" id="overlay"><div class="panel"><h2>🌸 しゅじんこうを えらんでね！</h2><p>すきな なかまを タップしよう</p><div class="heroes" id="heroes"></div><input id="name" maxlength="12" placeholder="なまえを いれてね"><div><button class="start" id="start">🌱 このキャラで はじめる！</button></div><div class="msg" id="msg"></div></div></div><script>
const types=[['ぼうけんか','#e77d53','#9b592d','🗡️'],['まほうつかい','#9b83cf','#648fc8','⭐'],['レンジャー','#74aa71','#8b7043','🏹'],['ヒーラー','#a6c9e6','#efc66d','💗'],['にんじゃ','#646b8c','#34384e','✦'],['はつめいか','#f2a3b4','#dc8596','⚙']];
function heroSVG(i){const t=types[i],hat=i===1?'<path d="M17 36 L40 3 L62 36Z" fill="#7761b3" stroke="#65508d" stroke-width="2"/><ellipse cx="40" cy="36" rx="32" ry="6" fill="#8069bd"/>':i===2?'<path d="M10 29 Q40 0 70 29 L63 37 L18 37Z" fill="#64965e" stroke="#567d4c" stroke-width="2"/>':i===4?'<path d="M13 28 Q40 17 67 28 L65 38 L15 38Z" fill="#555a75"/>':'<path d="M17 30 Q40 4 63 30 L60 35 L20 35Z" fill="'+t[1]+'"/>';return `<svg viewBox="0 0 80 112" xmlns="http://www.w3.org/2000/svg"><ellipse cx="40" cy="106" rx="23" ry="4" fill="#624d3b" opacity=".2"/><path d="M25 85 L23 104 L36 104 L40 86 M45 86 L45 104 L58 104 L55 85" fill="#6f5846" stroke="#59402e" stroke-width="3"/><path d="M21 65 Q40 53 59 65 L64 90 Q40 100 16 90Z" fill="${t[1]}" stroke="#8e694b" stroke-width="2"/><path d="M22 68 L12 83 M58 68 L69 83" stroke="#f5cda7" stroke-width="9" stroke-linecap="round"/><path d="M15 40 Q10 12 40 12 Q70 12 65 42 L65 61 Q40 73 15 61Z" fill="${t[2]}"/><ellipse cx="40" cy="44" rx="23" ry="26" fill="#ffe0b8" stroke="#b58762" stroke-width="2"/><path d="M17 34 Q28 8 42 21 Q56 11 64 35 Q44 28 35 27 Q27 39 17 34" fill="${t[2]}"/>${hat}<ellipse cx="32" cy="47" rx="2.7" ry="3.5" fill="#4a3831"/><ellipse cx="48" cy="47" rx="2.7" ry="3.5" fill="#4a3831"/><path d="M35 58 Q40 63 45 58" fill="none" stroke="#bb756d" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="55" r="4" fill="#f2a3a0" opacity=".65"/><circle cx="58" cy="55" r="4" fill="#f2a3a0" opacity=".65"/><text x="40" y="83" text-anchor="middle" font-size="15">${t[3]}</text></svg>`}
const heroes=document.getElementById('heroes');let chosen=0;types.forEach((t,i)=>{let b=document.createElement('button');b.className='hero';b.dataset.i=i;b.setAttribute('aria-pressed',i===0?'true':'false');b.innerHTML=`<div class="preview">${heroSVG(i)}</div><strong>${t[0]}</strong>`;b.onclick=()=>{chosen=i;document.querySelectorAll('.hero').forEach((x,j)=>x.setAttribute('aria-pressed',j===i?'true':'false'))};heroes.append(b)});
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let player={x:0,y:0},target=null,pressed=new Set(),steps=0,heroImg=new Image(),active=false,heroName='';function updateHero(){heroImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(heroSVG(chosen));document.getElementById('heroLabel').textContent='🌱 '+heroName+' の草原'}
function start(){heroName=document.getElementById('name').value.trim()||'ぼうけんしゃ';active=true;updateHero();document.getElementById('overlay').hidden=true;try{localStorage.setItem('kanji-grassland',JSON.stringify({chosen,heroName}))}catch(e){}}document.getElementById('start').onclick=start;document.getElementById('change').onclick=()=>{document.getElementById('overlay').hidden=false;target=null;pressed.clear()};try{let s=JSON.parse(localStorage.getItem('kanji-grassland'));if(s&&Number.isInteger(s.chosen)&&s.chosen>=0&&s.chosen<6){chosen=s.chosen;document.querySelectorAll('.hero').forEach((x,j)=>x.setAttribute('aria-pressed',j===chosen?'true':'false'));document.getElementById('name').value=s.heroName||'';heroName=s.heroName||'ぼうけんしゃ';updateHero();active=true;document.getElementById('overlay').hidden=true}}catch(e){}
function rnd(x,y){let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)}function ground(){const w=canvas.width,h=canvas.height,cx=player.x,cy=player.y;ctx.fillStyle='#addb90';ctx.fillRect(0,0,w,h);let size=72,minX=Math.floor((cx-w/2)/size)-1,maxX=Math.ceil((cx+w/2)/size)+1,minY=Math.floor((cy-h/2)/size)-1,maxY=Math.ceil((cy+h/2)/size)+1;for(let gx=minX;gx<=maxX;gx++)for(let gy=minY;gy<=maxY;gy++){let x=gx*size-cx+w/2,y=gy*size-cy+h/2,r=rnd(gx,gy);if(r>.77){ctx.fillStyle='#bce49c';ctx.beginPath();ctx.ellipse(x+30,y+30,38,22,r*6,0,Math.PI*2);ctx.fill()}for(let j=0;j<4;j++){let xx=x+rnd(gx*7+j,gy*3+j)*size,yy=y+rnd(gx*4+j,gy*8+j)*size;ctx.strokeStyle='#79b968';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx,yy+5);ctx.lineTo(xx-2,yy);ctx.lineTo(xx+2,yy+2);ctx.stroke()}if(r>.87){let fx=x+size*.65,fy=y+size*.35;ctx.fillStyle=['#f8a8b7','#ffe18b','#fff8ef'][Math.floor(r*100)%3];for(let k=0;k<5;k++){let a=k*Math.PI*2/5;ctx.beginPath();ctx.arc(fx+Math.cos(a)*5,fy+Math.sin(a)*5,4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#f5c45e';ctx.beginPath();ctx.arc(fx,fy,3,0,7);ctx.fill()}}}
function draw(t){ground();const w=canvas.width,h=canvas.height;ctx.fillStyle='#496a3b33';ctx.beginPath();ctx.ellipse(w/2,h/2+7,29,9,0,0,7);ctx.fill();let bounce=(target||pressed.size)?Math.sin(steps*.28)*5:0;if(heroImg.complete&&heroImg.naturalWidth){ctx.save();ctx.translate(w/2,h/2-95+bounce);ctx.drawImage(heroImg,-44,0,88,123);ctx.restore()}else{ctx.fillStyle='#f7d6b3';ctx.beginPath();ctx.arc(w/2,h/2-55,24,0,7);ctx.fill()}ctx.fillStyle='#ffffffb9';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(heroName||'ぼうけんしゃ',w/2,h/2-110+bounce);if(target){let sx=target.x-player.x+w/2,sy=target.y-player.y+h/2;ctx.strokeStyle='#fff9d1';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,12,0,7);ctx.stroke()}}
let last=performance.now();function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(active){let dx=0,dy=0;if(pressed.has('up'))dy--;if(pressed.has('down'))dy++;if(pressed.has('left'))dx--;if(pressed.has('right'))dx++;if(dx||dy){target=null;let d=Math.hypot(dx,dy);player.x+=dx/d*205*dt;player.y+=dy/d*205*dt;steps+=205*dt/10}else if(target){let tx=target.x-player.x,ty=target.y-player.y,d=Math.hypot(tx,ty);if(d<4){target=null}else{let move=Math.min(d,205*dt);player.x+=tx/d*move;player.y+=ty/d*move;steps+=move/10}}}draw(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
canvas.addEventListener('pointerdown',e=>{if(!active)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*canvas.width,y=(e.clientY-r.top)/r.height*canvas.height;target={x:player.x+x-canvas.width/2,y:player.y+y-canvas.height/2}});document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.add(d)});b.addEventListener('pointerup',()=>pressed.delete(d));b.addEventListener('pointercancel',()=>pressed.delete(d));b.addEventListener('lostpointercapture',()=>pressed.delete(d))});window.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();pressed.add(d)}});window.addEventListener('keyup',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d)pressed.delete(d)});
</script></body></html>
