<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KANJI WORLD - はじまりの むら</title><style>body{margin:0;background:#e8f6ef;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;color:#244a3d}main{max-width:720px;margin:auto;padding:10px}h1{font-size:22px;text-align:center;margin:6px}p{text-align:center;font-size:13px;margin:6px}canvas{display:block;width:100%;aspect-ratio: 4/3;background:#91d89c;border:4px solid #fff;border-radius:18px;box-sizing:border-box;touch-action:none;box-shadow:0 3px 12px #0002}.controls{display:flex;justify-content:space-between;align-items:center;margin:10px 4px;gap:8px}.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:4px}.dpad button:first-child{grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{border:0;border-radius:13px;background:#fff;color:#285843;font-size:20px;font-weight:700;box-shadow:0 2px 4px #0002;touch-action:none}.act{padding:15px;font-size:15px;background:#ffe5a3}.dialog{min-height:48px;background:#fff;border-radius:15px;padding:12px;margin-top:5px;line-height:2;font-size:16px}ruby rt{font-size:9px;color:#657f72}small{display:block;text-align:center;margin:7px;color:#527769}</style></head><body><main><h1>🌳 KANJI WORLD 🌳</h1><p>はじまりの むら — <ruby>村<rt>むら</rt></ruby>を <ruby>歩<rt>ある</rt></ruby>いて みよう！</p><canvas id="game" width="640" height="480" aria-label="村のゲーム画面"></canvas><div class="controls"><div class="dpad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="act" id="talk">💬 <ruby>話<rt>はな</rt></ruby>す</button></div><div class="dialog" id="dialog">👋 ポポに <ruby>近<rt>ちか</rt></ruby>づいて、「<ruby>話<rt>はな</rt></ruby>す」を おしてね。<br>または <ruby>地面<rt>じめん</rt></ruby>を タップして <ruby>歩<rt>ある</rt></ruby>こう！</div><small>スマホ：<ruby>方向<rt>ほうこう</rt></ruby>ボタン・タップ　｜　パソコン：<ruby>矢印<rt>やじるし</rt></ruby>キー・クリック</small></main><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),msg=document.getElementById('dialog');const player={x:310,y:345},npc={x:340,y:225},dragon={x:275,y:355};let target=null,held=null,last=0,phase=0;const W=640,H=480;
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function rounded(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function tree(x,y,s=1){circle(x,y+8*s,21*s,'#62a967');rect(x-5*s,y,10*s,21*s,'#9c6d48');circle(x-12*s,y-12*s,19*s,'#3f9e68');circle(x+11*s,y-16*s,20*s,'#4fb67a');circle(x,y-29*s,17*s,'#63c789')}
function house(x,y){rounded(x,y+25,100,70,8,'#fff1cf');ctx.fillStyle='#d77764';ctx.beginPath();ctx.moveTo(x-9,y+32);ctx.lineTo(x+50,y-17);ctx.lineTo(x+109,y+32);ctx.closePath();ctx.fill();rounded(x+38,y+55,26,40,4,'#a77960');rounded(x+13,y+48,18,19,3,'#9bcee6')}
function person(x,y,shirt){circle(x,y+18,15,'#0002');rounded(x-11,y+4,22,25,8,shirt);circle(x,y-8,15,'#ffd5a5');ctx.fillStyle='#604a38';ctx.beginPath();ctx.arc(x,y-13,15,Math.PI,Math.PI*2);ctx.fill();circle(x-5,y-6,1.6,'#493d35');circle(x+5,y-6,1.6,'#493d35')}
function draw(){rect(0,0,W,H,'#a2dfa2');for(let i=0;i<36;i++){let x=(i*173+43)%W,y=(i*101+67)%H;circle(x,y,3,'#78c885')}ctx.strokeStyle='#e9d8a6';ctx.lineWidth=65;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(315,490);ctx.lineTo(315,265);ctx.lineTo(480,265);ctx.stroke();ctx.strokeStyle='#d2c18f';ctx.lineWidth=3;ctx.setLineDash([8,12]);ctx.stroke();ctx.setLineDash([]);rect(0,0,640,72,'#6dbed6');for(let x=20;x<640;x+=80)circle(x,44,14,'#9be2ee');rounded(292,15,48,105,6,'#bc9368');for(let x of [36,90,155,535,590])tree(x,140,.85);for(let x of [40,95,555,600])tree(x,400,.9);house(400,115);house(135,195);circle(525,365,38,'#8ad3ed');circle(525,365,26,'#9fe4f1');for(let i=0;i<7;i++)circle(470+i*13,412+(i%2)*5,5,['#fff3a1','#f7b4c5','#fff'][i%3]);person(npc.x,npc.y,'#f4a45b');ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillStyle='#2c634e';ctx.fillText('ポポ',npc.x,npc.y-31);circle(dragon.x,dragon.y+12,13,'#0002');circle(dragon.x,dragon.y,14,'#70b8e5');circle(dragon.x+7,dragon.y-12,8,'#8cd1f3');ctx.fillStyle='#4d9dcc';ctx.beginPath();ctx.moveTo(dragon.x-10,dragon.y-3);ctx.lineTo(dragon.x-24,dragon.y-18);ctx.lineTo(dragon.x-17,dragon.y+10);ctx.fill();circle(dragon.x+10,dragon.y-13,2,'#273c48');person(player.x,player.y,'#6387de');ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText('あなた',player.x,player.y-31);if(target){circle(target.x,target.y,6,'#fff9');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(target.x,target.y,11,0,7);ctx.stroke()}}
function move(dx,dy,step){player.x=Math.max(20,Math.min(620,player.x+dx*step));player.y=Math.max(95,Math.min(460,player.y+dy*step));dragon.x+=(player.x-32-dragon.x)*.045;dragon.y+=(player.y+6-dragon.y)*.045}
function tick(t){let dt=Math.min(32,t-last||16);last=t;phase+=dt;if(held){let v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[held];move(v[0],v[1],dt*.17);target=null}else if(target){let dx=target.x-player.x,dy=target.y-player.y,d=Math.hypot(dx,dy);if(d<4)target=null;else move(dx/d,dy/d,Math.min(d,dt*.17))}else{dragon.x+=(player.x-32-dragon.x)*.03;dragon.y+=(player.y+6-dragon.y)*.03}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function talk(){let d=Math.hypot(player.x-npc.x,player.y-npc.y);if(d<85)msg.innerHTML='🧑 ポポ：「こんにちは！ ここは <ruby>漢字<rt>かんじ</rt></ruby>の <ruby>村<rt>むら</rt></ruby>だよ。<ruby>森<rt>もり</rt></ruby>には たくさんの <ruby>発見<rt>はっけん</rt></ruby>が あるんだ！」';else msg.innerHTML='🧑 ポポの ところまで <ruby>歩<rt>ある</rt></ruby>いて みよう！';}document.getElementById('talk').onclick=talk;
for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();held=b.dataset.dir;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>held=null);b.addEventListener('pointercancel',()=>held=null);b.addEventListener('lostpointercapture',()=>held=null)}
window.addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){held=k;e.preventDefault()}if(e.key===' '||e.key==='Enter')talk()});window.addEventListener('keyup',e=>{if(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key])===held)held=null});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();target={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};held=null});
</script></body></html>
