<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KANJI WORLD - はじまりの むら</title><style>body{margin:0;background:#e8f6ef;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;color:#244a3d}main{max-width:720px;margin:auto;padding:10px}h1{font-size:22px;text-align:center;margin:6px}p{text-align:center;font-size:13px;margin:6px}canvas{display:block;width:100%;aspect-ratio: 4/3;background:#91d89c;border:4px solid #fff;border-radius:18px;box-sizing:border-box;touch-action:none;box-shadow:0 3px 12px #0002}.game-wrap{position:relative}.controls{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 13px 13px;gap:8px}.controls button{pointer-events:auto;user-select:none;-webkit-user-select:none;background:#ffffffdc;border:2px solid #ffffffaa;box-shadow:0 3px 9px #153a3566;backdrop-filter:blur(3px)}.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,44px);gap:4px}.dpad button:first-child{grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{cursor:pointer;border:0;border-radius:13px;background:#fff;color:#285843;font-size:20px;font-weight:700;box-shadow:0 2px 4px #0002;touch-action:none}.controls .act{padding:12px 14px;font-size:15px;background:#ffe5a3e8;margin-bottom:2px}.dialog{min-height:48px;background:#fff;border-radius:15px;padding:12px;margin-top:5px;line-height:2;font-size:16px}ruby rt{font-size:9px;color:#657f72}small{display:block;text-align:center;margin:7px;color:#527769}@media(max-width:400px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,39px)}.controls{padding:0 8px 8px}.controls .act{padding:10px;font-size:13px}}</style></head><body><main><h1>🌳 KANJI WORLD 🌳</h1><p>はじまりの むら — <ruby>村<rt>むら</rt></ruby>を <ruby>歩<rt>ある</rt></ruby>いて みよう！</p><div class="game-wrap"><canvas id="game" width="640" height="480" aria-label="村のゲーム画面"></canvas><div class="controls"><div class="dpad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="act" id="talk">💬 <ruby>話<rt>はな</rt></ruby>す</button></div></div><div class="dialog" id="dialog">👋 ポポに <ruby>近<rt>ちか</rt></ruby>づいて、「<ruby>話<rt>はな</rt></ruby>す」を おしてね。<br>または <ruby>地面<rt>じめん</rt></ruby>を タップして <ruby>歩<rt>ある</rt></ruby>こう！</div><small>スマホ：<ruby>方向<rt>ほうこう</rt></ruby>ボタン・タップ　｜　パソコン：<ruby>矢印<rt>やじるし</rt></ruby>キー・クリック</small></main><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),msg=document.getElementById('dialog');const player={x:310,y:345},npc={x:340,y:225},dragon={x:275,y:355};let target=null,held=null,last=0,phase=0;const W=640,H=480;
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function rounded(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}

function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function tree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ellipse(9,19,27,11,'#40674455');
 rounded(-6,-5,13,34,4,'#795139');rect(-3,-3,3,27,'#a8784c');
 for(let [a,b,r,c] of [[-17,-13,22,'#327d4c'],[16,-18,24,'#398f56'],[-3,-31,25,'#459e5d'],[-19,-30,15,'#4ba76a'],[13,-38,17,'#58ad6a']])circle(a,b,r,c);
 for(let [a,b,r] of [[-19,-24,11],[-4,-41,13],[13,-28,9]])circle(a,b,r,'#78c985');
 for(let i=0;i<11;i++){let a=(i*41)%46-23,b=-14-(i*19)%37;circle(a,b,2.2,i%2?'#a4db90':'#6fbe74')}
 ctx.restore()
}
function house(x,y){
 ellipse(x+54,y+91,64,16,'#41664d44');
 rounded(x,y+23,102,74,7,'#e5c49a');
 rounded(x+5,y+32,92,58,5,'#f3ddbb');
 for(let i=0;i<6;i++)line(x+5,y+41+i*8,x+97,y+41+i*8,'#d8b990',.8);
 ctx.fillStyle='#8c433a';ctx.beginPath();ctx.moveTo(x-13,y+32);ctx.lineTo(x+50,y-21);ctx.lineTo(x+115,y+32);ctx.closePath();ctx.fill();
 ctx.fillStyle='#b95d4b';ctx.beginPath();ctx.moveTo(x-7,y+27);ctx.lineTo(x+50,y-16);ctx.lineTo(x+107,y+27);ctx.closePath();ctx.fill();
 for(let i=0;i<5;i++)line(x+4+i*20,y+18,x+50,y-14,'#d78065',1.3);
 rounded(x+39,y+54,27,42,3,'#84573e');rounded(x+43,y+58,19,38,2,'#a8794e');
 circle(x+59,y+79,2,'#edcb77');
 rounded(x+12,y+48,22,23,3,'#875e48');rounded(x+15,y+51,16,17,2,'#9ed6df');
 line(x+23,y+51,x+23,y+68,'#f7f0d6',2);line(x+15,y+59,x+31,y+59,'#f7f0d6',2);
 rounded(x+11,y+71,24,4,2,'#bba082');
}
function person(x,y,shirt){
 ellipse(x,y+24,16,7,'#34503a55');
 rounded(x-12,y+6,24,22,7,shirt);
 rounded(x-10,y+22,8,8,3,'#55516a');rounded(x+2,y+22,8,8,3,'#55516a');
 circle(x,y-8,15,'#eab98c');circle(x-13,y-5,3,'#eab98c');circle(x+13,y-5,3,'#eab98c');
 ctx.fillStyle='#493b30';ctx.beginPath();ctx.arc(x,y-13,15,Math.PI,Math.PI*2);ctx.fill();
 ellipse(x-7,y-17,9,5,'#554031');ellipse(x+6,y-18,9,5,'#554031');
 circle(x-5,y-5,1.6,'#392f2a');circle(x+5,y-5,1.6,'#392f2a');
 line(x-3,y+1,x+3,y+1,'#a46b60',1);
}
function dragonDraw(x,y){
 ellipse(x,y+15,19,7,'#3a5d5c55');
 ctx.fillStyle='#4b9bb8';ctx.beginPath();ctx.moveTo(x-6,y+1);ctx.lineTo(x-25,y-19);ctx.lineTo(x-19,y+10);ctx.closePath();ctx.fill();
 ctx.fillStyle='#70bfd2';ctx.beginPath();ctx.moveTo(x+5,y+1);ctx.lineTo(x+18,y-17);ctx.lineTo(x+16,y+12);ctx.closePath();ctx.fill();
 ellipse(x,y+3,14,16,'#4d9caa');ellipse(x+7,y-10,11,10,'#75c6ce');
 ellipse(x+2,y+7,8,10,'#b2e1ca');circle(x+11,y-12,2,'#273b40');
 for(let i=0;i<3;i++){ctx.fillStyle='#e2ddaa';ctx.beginPath();ctx.moveTo(x-7+i*7,y-10);ctx.lineTo(x-4+i*7,y-20);ctx.lineTo(x+i*7,y-10);ctx.fill()}
}
function draw(){
 rect(0,0,W,H,'#88c47b');
 for(let i=0;i<170;i++){let x=(i*173+43)%W,y=(i*101+67)%H;line(x,y,x+((i%3)-1)*2,y-3,i%4?'#6eb46d':'#a1d48a',1.5)}
 ctx.strokeStyle='#bca477';ctx.lineWidth=72;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(315,495);ctx.lineTo(315,265);ctx.lineTo(480,265);ctx.stroke();
 ctx.strokeStyle='#e6d0a0';ctx.lineWidth=62;ctx.stroke();
 for(let i=0;i<60;i++){let x=(i*47)%100-50+315,y=(i*67)%225+265;if(x>285&&x<345)ellipse(x,y,2,1,'#c5ac7b')}
 let water=ctx.createLinearGradient(0,0,0,80);water.addColorStop(0,'#438eae');water.addColorStop(1,'#81c9cf');rect(0,0,640,76,water);
 for(let i=0;i<19;i++){let x=(i*73+17)%640,y=12+(i*23)%53;line(x,y,x+17,y,'#d0edf0',1.6)}
 rounded(288,14,56,112,5,'#7e5c3c');
 for(let i=0;i<9;i++){let y=20+i*12;rounded(291,y,50,9,2,i%2?'#b68a5a':'#a8794d');line(294,y+2,337,y+2,'#d3ae77',1)}
 for(let x of [36,90,155,535,590])tree(x,140,.85);
 for(let x of [40,95,555,600])tree(x,400,.9);
 house(400,115);house(135,195);
 ellipse(525,368,46,32,'#5d9a8c');ellipse(525,365,41,28,'#69b7c7');ellipse(521,358,28,17,'#9bd9dc');
 for(let i=0;i<9;i++){let x=470+i*13,y=411+(i%3)*6;line(x,y+5,x,y-3,'#4f9d52',2);circle(x,y-4,4,['#f9e5a0','#f3a7aa','#fff7dc'][i%3])}
 person(npc.x,npc.y,'#c88755');
 ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillStyle='#244f3a';ctx.fillText('ポポ',npc.x,npc.y-32);
 dragonDraw(dragon.x,dragon.y);
 person(player.x,player.y,'#507dc1');
 ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText('あなた',player.x,player.y-32);
 if(target){circle(target.x,target.y,6,'#fff9');ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(target.x,target.y,11,0,7);ctx.stroke()}
}
function move(dx,dy,step){player.x=Math.max(20,Math.min(620,player.x+dx*step));player.y=Math.max(95,Math.min(460,player.y+dy*step));dragon.x+=(player.x-32-dragon.x)*.045;dragon.y+=(player.y+6-dragon.y)*.045}
function tick(t){let dt=Math.min(32,t-last||16);last=t;phase+=dt;if(held){let v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[held];move(v[0],v[1],dt*.17);target=null}else if(target){let dx=target.x-player.x,dy=target.y-player.y,d=Math.hypot(dx,dy);if(d<4)target=null;else move(dx/d,dy/d,Math.min(d,dt*.17))}else{dragon.x+=(player.x-32-dragon.x)*.03;dragon.y+=(player.y+6-dragon.y)*.03}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function talk(){let d=Math.hypot(player.x-npc.x,player.y-npc.y);if(d<85)msg.innerHTML='🧑 ポポ：「こんにちは！ ここは <ruby>漢字<rt>かんじ</rt></ruby>の <ruby>村<rt>むら</rt></ruby>だよ。<ruby>森<rt>もり</rt></ruby>には たくさんの <ruby>発見<rt>はっけん</rt></ruby>が あるんだ！」';else msg.innerHTML='🧑 ポポの ところまで <ruby>歩<rt>ある</rt></ruby>いて みよう！';}document.getElementById('talk').onclick=talk;
for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();held=b.dataset.dir;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>held=null);b.addEventListener('pointercancel',()=>held=null);b.addEventListener('lostpointercapture',()=>held=null)}
window.addEventListener('keydown',e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){held=k;e.preventDefault()}if(e.key===' '||e.key==='Enter')talk()});window.addEventListener('keyup',e=>{if(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key])===held)held=null});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();target={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};held=null});
</script></body></html>
