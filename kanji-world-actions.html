<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KANJI WORLD ひろい草原のたんけん</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4dc;color:#62442d;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif}header{text-align:center;padding:12px;font-size:21px;font-weight:900;background:#fff1cd}.wrap{max-width:960px;margin:auto;padding:10px}#game{width:100%;aspect-ratio:4/3;max-height:66vh;display:block;border:5px solid #b48a55;border-radius:18px;background:#a7d58a;touch-action:none;box-shadow:0 5px 18px #684d2c33}.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.pill{background:white;border:2px solid #d9b77d;border-radius:14px;padding:7px 12px;font-weight:bold}button{cursor:pointer;border:2px solid #b98c57;background:#ffe3a6;color:#60452e;border-radius:14px;padding:10px 14px;font-size:16px;font-weight:800}.explorebar{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:800;margin:7px 0;color:#745336}.explorebar span{background:#fff9e8;border-radius:12px;padding:7px 10px;border:1px solid #d9b77d}.note{text-align:center;font-size:14px;line-height:1.7}.overlay{position:fixed;inset:0;background:#43311dcc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.overlay[hidden]{display:none}.panel{background:#fff8e8;border:5px solid #c7a26d;border-radius:24px;padding:17px;width:min(570px,100%);max-height:95vh;overflow:auto;text-align:center}.panel h2{margin:5px 0}.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero{background:#fff;border:3px solid #dec7a2;border-radius:15px;padding:8px 2px;font-size:12px;min-width:0}.hero[aria-pressed=true]{border-color:#f07caa;background:#ffebf3}.preview{height:94px;display:flex;align-items:center;justify-content:center}.preview svg{height:90px;width:80px}.hero strong{display:block}.panel input{font-size:18px;border:2px solid #c4a16e;border-radius:12px;padding:11px;width:90%;margin:12px auto}.start{background:#f8a1ba;border-color:#db7193;padding:13px 22px}.msg{min-height:20px;color:#aa3758}@media(max-width:430px){header{font-size:18px}.preview{height:76px}.preview svg{height:73px}.hero{font-size:11px}.panel{padding:10px}}#actions{margin:10px 0;padding:13px;background:#fff9e8;border:3px solid #c7a26d;border-radius:18px;text-align:center}#actions[hidden],#quizbox[hidden]{display:none}#actionButtons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}#actionButtons button{padding:12px 4px;font-size:16px}#actionTitle{font-size:19px;font-weight:900}#actionStatus{font-size:14px;margin:8px 0;color:#745336}#quizbox{background:#fff0d3;padding:10px;border-radius:12px;margin-top:8px}#quizbox button{margin:4px}#supplies{font-weight:800;background:#fff9e8;border-radius:12px;padding:8px;margin:8px 0}ruby rt{font-size:.55em}</style></head><body><header>🌸 KANJI WORLD — ひろい草原 🌱</header><main class="wrap"><div class="hud"><span class="pill" id="heroLabel">🌱 はじまりの草原</span><button id="change">👤 キャラをかえる</button></div><div class="explorebar"><span id="distance">🏕️ はじまりの場所：0m</span><span id="found">🌼 見つけた場所：0 / 5</span></div><canvas id="game" width="800" height="600" aria-label="広い草原。行きたい場所をタップすると主人公が歩きます"></canvas><div id="actions" hidden><div id="actionTitle"></div><div id="actionStatus">なにを する？</div><div id="actionButtons"><button id="inspect">🔎 しらべる</button><button id="gather">🪵 あつめる</button><button id="quiz">📖 クイズ</button><button id="leave">👣 たんけんする</button></div><div id="quizbox" hidden><div>「木（き）」に「木（き）」を あわせると？</div><button data-answer="wrong">花（はな）</button><button data-answer="right">林（はやし）</button><button data-answer="wrong">山（やま）</button></div></div><div id="supplies">🪵 もくざい：<span id="wood">0</span>こ　🌟 はっけん：<span id="foundCount">0</span> / 5</div><p class="note">🌷 草原をタップして、遠くまでたんけんしよう！<br>🌳 木や池を見つけよう。村づくりは次のお楽しみ！</p></main><div class="overlay" id="overlay"><div class="panel"><h2>🌸 しゅじんこうを えらんでね！</h2><p>すきな なかまを タップしよう</p><div class="heroes" id="heroes"></div><input id="name" maxlength="12" placeholder="なまえを いれてね"><div><button class="start" id="start">🌱 このキャラで はじめる！</button></div><div class="msg" id="msg"></div></div></div><script>
const types=[['ぼうけんか','#e77d53','#9b592d','🗡️'],['まほうつかい','#9b83cf','#648fc8','⭐'],['レンジャー','#74aa71','#8b7043','🏹'],['ヒーラー','#a6c9e6','#efc66d','💗'],['にんじゃ','#646b8c','#34384e','✦'],['はつめいか','#f2a3b4','#dc8596','⚙']];
function heroSVG(i){const t=types[i],hat=i===1?'<path d="M17 36 L40 3 L62 36Z" fill="#7761b3" stroke="#65508d" stroke-width="2"/><ellipse cx="40" cy="36" rx="32" ry="6" fill="#8069bd"/>':i===2?'<path d="M10 29 Q40 0 70 29 L63 37 L18 37Z" fill="#64965e" stroke="#567d4c" stroke-width="2"/>':i===4?'<path d="M13 28 Q40 17 67 28 L65 38 L15 38Z" fill="#555a75"/>':'<path d="M17 30 Q40 4 63 30 L60 35 L20 35Z" fill="'+t[1]+'"/>';return `<svg viewBox="0 0 80 112" xmlns="http://www.w3.org/2000/svg"><ellipse cx="40" cy="106" rx="23" ry="4" fill="#624d3b" opacity=".2"/><path d="M25 85 L23 104 L36 104 L40 86 M45 86 L45 104 L58 104 L55 85" fill="#6f5846" stroke="#59402e" stroke-width="3"/><path d="M21 65 Q40 53 59 65 L64 90 Q40 100 16 90Z" fill="${t[1]}" stroke="#8e694b" stroke-width="2"/><path d="M22 68 L12 83 M58 68 L69 83" stroke="#f5cda7" stroke-width="9" stroke-linecap="round"/><path d="M15 40 Q10 12 40 12 Q70 12 65 42 L65 61 Q40 73 15 61Z" fill="${t[2]}"/><ellipse cx="40" cy="44" rx="23" ry="26" fill="#ffe0b8" stroke="#b58762" stroke-width="2"/><path d="M17 34 Q28 8 42 21 Q56 11 64 35 Q44 28 35 27 Q27 39 17 34" fill="${t[2]}"/>${hat}<ellipse cx="32" cy="47" rx="2.7" ry="3.5" fill="#4a3831"/><ellipse cx="48" cy="47" rx="2.7" ry="3.5" fill="#4a3831"/><path d="M35 58 Q40 63 45 58" fill="none" stroke="#bb756d" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="55" r="4" fill="#f2a3a0" opacity=".65"/><circle cx="58" cy="55" r="4" fill="#f2a3a0" opacity=".65"/><text x="40" y="83" text-anchor="middle" font-size="15">${t[3]}</text></svg>`}
const heroes=document.getElementById('heroes');let chosen=0;types.forEach((t,i)=>{let b=document.createElement('button');b.className='hero';b.dataset.i=i;b.setAttribute('aria-pressed',i===0?'true':'false');b.innerHTML=`<div class="preview">${heroSVG(i)}</div><strong>${t[0]}</strong>`;b.onclick=()=>{chosen=i;document.querySelectorAll('.hero').forEach((x,j)=>x.setAttribute('aria-pressed',j===i?'true':'false'))};heroes.append(b)});
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let player={x:0,y:0},target=null,pressed=new Set(),steps=0,heroImg=new Image(),active=false,heroName='';function updateHero(){heroImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(heroSVG(chosen));document.getElementById('heroLabel').textContent='🌱 '+heroName+' の草原'}
function start(){heroName=document.getElementById('name').value.trim()||'ぼうけんしゃ';active=true;updateHero();document.getElementById('overlay').hidden=true;try{localStorage.setItem('kanji-grassland',JSON.stringify({chosen,heroName}))}catch(e){}}document.getElementById('start').onclick=start;document.getElementById('change').onclick=()=>{document.getElementById('overlay').hidden=false;target=null;pressed.clear()};try{let s=JSON.parse(localStorage.getItem('kanji-grassland'));if(s&&Number.isInteger(s.chosen)&&s.chosen>=0&&s.chosen<6){chosen=s.chosen;document.querySelectorAll('.hero').forEach((x,j)=>x.setAttribute('aria-pressed',j===chosen?'true':'false'));document.getElementById('name').value=s.heroName||'';heroName=s.heroName||'ぼうけんしゃ';updateHero();active=true;document.getElementById('overlay').hidden=true}}catch(e){}
function rnd(x,y){let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)}function ground(){const w=canvas.width,h=canvas.height,cx=player.x,cy=player.y;ctx.fillStyle='#addb90';ctx.fillRect(0,0,w,h);let size=72,minX=Math.floor((cx-w/2)/size)-1,maxX=Math.ceil((cx+w/2)/size)+1,minY=Math.floor((cy-h/2)/size)-1,maxY=Math.ceil((cy+h/2)/size)+1;for(let gx=minX;gx<=maxX;gx++)for(let gy=minY;gy<=maxY;gy++){let x=gx*size-cx+w/2,y=gy*size-cy+h/2,r=rnd(gx,gy);if(r>.77){ctx.fillStyle='#bce49c';ctx.beginPath();ctx.ellipse(x+30,y+30,38,22,r*6,0,Math.PI*2);ctx.fill()}for(let j=0;j<4;j++){let xx=x+rnd(gx*7+j,gy*3+j)*size,yy=y+rnd(gx*4+j,gy*8+j)*size;ctx.strokeStyle='#79b968';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx,yy+5);ctx.lineTo(xx-2,yy);ctx.lineTo(xx+2,yy+2);ctx.stroke()}if(r>.87){let fx=x+size*.65,fy=y+size*.35;ctx.fillStyle=['#f8a8b7','#ffe18b','#fff8ef'][Math.floor(r*100)%3];for(let k=0;k<5;k++){let a=k*Math.PI*2/5;ctx.beginPath();ctx.arc(fx+Math.cos(a)*5,fy+Math.sin(a)*5,4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#f5c45e';ctx.beginPath();ctx.arc(fx,fy,3,0,7);ctx.fill()}}}
const places=[{x:450,y:-180,kind:'tree',name:'おおきな木'},{x:-560,y:240,kind:'pond',name:'ちいさな池'},{x:320,y:670,kind:'flowers',name:'お花ばたけ'},{x:-850,y:-500,kind:'rock',name:'ふしぎな岩'},{x:1000,y:150,kind:'tree',name:'こもれびの木'}];const discovered=new Set();let wood=0,nearby=null,menuDismissed=-1;const actions=document.getElementById('actions'),quizbox=document.getElementById('quizbox'),status=document.getElementById('actionStatus');function nearPlace(){let best=-1,dist=135;places.forEach((p,i)=>{const d=Math.hypot(player.x-p.x,player.y-p.y);if(d<dist){dist=d;best=i}});return best}function showActions(){let n=nearPlace();if(n!==nearby){nearby=n;menuDismissed=-1;quizbox.hidden=true;status.textContent='なにを する？'}if(n>=0&&menuDismissed!==n){actions.hidden=false;document.getElementById('actionTitle').textContent='🌿 '+places[n].name+' に ついたよ！'}else actions.hidden=true}document.getElementById('inspect').onclick=()=>{status.textContent='🔎 '+places[nearby].name+' を はっけん！ ここを おぼえたよ。'};document.getElementById('gather').onclick=()=>{wood++;document.getElementById('wood').textContent=wood;status.textContent='🪵 もくざいを 1こ あつめたよ！'};document.getElementById('quiz').onclick=()=>{quizbox.hidden=false;status.textContent='📖 かんじの クイズに こたえよう！'};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{quizbox.hidden=true;if(b.dataset.answer==='right'){wood+=2;document.getElementById('wood').textContent=wood;status.textContent='🎉 せいかい！ もくざいを 2こ もらったよ！'}else status.textContent='🌱 もういちど ちょうせんしてね！'});document.getElementById('leave').onclick=()=>{menuDismissed=nearby;actions.hidden=true;quizbox.hidden=true};
function scenery(layer){const w=canvas.width,h=canvas.height;for(const p of [{x:0,y:0,kind:'camp',name:'はじまり'},...places]){const x=p.x-player.x+w/2,y=p.y-player.y+h/2;if(x < -140||x>w+140||y< -140||y>h+140)continue;if(layer==='back'&&p.kind==='tree'&&p.y>player.y+15)continue;if(layer==='front'&&(p.kind!=='tree'||p.y<=player.y+15))continue;if(layer==='front'&&p.kind==='camp')continue;ctx.save();ctx.translate(x,y);if(p.kind==='tree'){ctx.fillStyle='#86623f';ctx.fillRect(-12,-20,24,70);for(let j=0;j<5;j++){ctx.fillStyle=['#6ca85d','#83bd70','#579b54'][j%3];ctx.beginPath();ctx.arc(Math.cos(j*2.5)*29,-45+Math.sin(j*2.5)*19,34,0,7);ctx.fill()}}else if(p.kind==='pond'){ctx.fillStyle='#8ad5dc';ctx.beginPath();ctx.ellipse(0,15,105,62,-.2,0,7);ctx.fill();ctx.strokeStyle='#d7f6ed';ctx.lineWidth=5;ctx.stroke()}else if(p.kind==='flowers'){for(let j=0;j<24;j++){let a=j*2.4,r=Math.sqrt(j)*17;ctx.fillStyle=['#f4a7b9','#ffe5a0','#fff6ef','#c7a6e8'][j%4];ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,9,0,7);ctx.fill()}}else if(p.kind==='rock'){ctx.fillStyle='#b7aaa0';ctx.beginPath();ctx.moveTo(-66,37);ctx.lineTo(-40,-34);ctx.lineTo(23,-53);ctx.lineTo(71,21);ctx.lineTo(38,45);ctx.closePath();ctx.fill();ctx.strokeStyle='#8c827b';ctx.lineWidth=5;ctx.stroke()}else{ctx.fillStyle='#d6b78a';ctx.beginPath();ctx.ellipse(0,15,47,24,0,0,7);ctx.fill();ctx.font='45px system-ui';ctx.textAlign='center';ctx.fillText('🏕️',0,4)}ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff9e9';ctx.strokeText(p.name,0,p.kind==='tree'?-93:87);ctx.fillStyle='#62442d';ctx.fillText(p.name,0,p.kind==='tree'?-93:87);ctx.restore()}}
function discover(){for(let i=0;i<places.length;i++)if(Math.hypot(player.x-places[i].x,player.y-places[i].y)<135)discovered.add(i);document.getElementById('found').textContent='🌼 見つけた場所：'+discovered.size+' / 5';document.getElementById('foundCount').textContent=discovered.size;document.getElementById('distance').textContent='🏕️ はじまりから：約'+Math.round(Math.hypot(player.x,player.y)/20)+'m'}
function draw(t){ground();scenery('back');const w=canvas.width,h=canvas.height;ctx.fillStyle='#496a3b33';ctx.beginPath();ctx.ellipse(w/2,h/2+7,29,9,0,0,7);ctx.fill();let bounce=(target||pressed.size)?Math.sin(steps*.28)*5:0;if(heroImg.complete&&heroImg.naturalWidth){ctx.save();ctx.translate(w/2,h/2-95+bounce);ctx.drawImage(heroImg,-44,0,88,123);ctx.restore()}else{ctx.fillStyle='#f7d6b3';ctx.beginPath();ctx.arc(w/2,h/2-55,24,0,7);ctx.fill()}ctx.fillStyle='#ffffffb9';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(heroName||'ぼうけんしゃ',w/2,h/2-110+bounce);scenery('front');if(target){let sx=target.x-player.x+w/2,sy=target.y-player.y+h/2;ctx.strokeStyle='#fff9d1';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,12,0,7);ctx.stroke()}}
let last=performance.now();function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(active){let dx=0,dy=0;if(pressed.has('up'))dy--;if(pressed.has('down'))dy++;if(pressed.has('left'))dx--;if(pressed.has('right'))dx++;if(dx||dy){target=null;let d=Math.hypot(dx,dy);player.x+=dx/d*205*dt;player.y+=dy/d*205*dt;steps+=205*dt/10}else if(target){let tx=target.x-player.x,ty=target.y-player.y,d=Math.hypot(tx,ty);if(d<4){target=null}else{let move=Math.min(d,205*dt);player.x+=tx/d*move;player.y+=ty/d*move;steps+=move/10}}}discover();showActions();draw(now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
canvas.addEventListener('pointerdown',e=>{if(!active)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*canvas.width,y=(e.clientY-r.top)/r.height*canvas.height;target={x:player.x+x-canvas.width/2,y:player.y+y-canvas.height/2};menuDismissed=-1});window.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();pressed.add(d)}});window.addEventListener('keyup',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d)pressed.delete(d)});
</script></body></html>
